<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>구현 방식 예시 — 2w_doridu Archive</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f1ec; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
// 구현 방식 예시: ① 높이 지도 디오라마(잘린 옆면 지층) ② 다면체를 밀어 만든 덤불 + 그늘 ③ 상자 관절 인물 + 2관절 IK(기타 치는 손)
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color("#f4f1ec");
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7, 5.5, 8);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 0.8, 0); controls.enableDamping = true;
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, flatShading: true, ...o });
const sun = new THREE.DirectionalLight("#fff0dc", 3); sun.position.set(-5, 8, 4); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5 });
scene.add(sun, new THREE.HemisphereLight("#9db8ef", "#b48d78", 1.3));

// ① 높이 지도 디오라마: 4×4 블록, 윗면은 언덕, 잘린 네 옆면은 흙 지층 띠
const S = 4, N = 40, BASE = -0.9;
const h = (x, z) => 0.35 * Math.sin(x * 1.3) * Math.cos(z * 1.1) + 0.25 * Math.sin(x * 2.7 + z * 1.9) + 0.4 * Math.exp(-((x + 1) ** 2 + (z + 1) ** 2));
{
  const g = new THREE.PlaneGeometry(S, S, N, N).rotateX(-Math.PI / 2), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, h(p.getX(i), p.getZ(i)));
  g.computeVertexNormals();
  const top = new THREE.Mesh(g, mat("#cfa58f")); top.receiveShadow = top.castShadow = true; scene.add(top);
  const bands = ["#a77a6a", "#8f6457", "#b88a74", "#7a5649", "#9c6f5f"].map(c => mat(c));
  // 옆면 하나: 윗선은 지형 높이를 따라가고 아래는 받침까지, 높이에 따라 지층 색이 바뀜
  for (const [ax, az, sx, sz] of [[-S / 2, S / 2, 1, 0], [S / 2, -S / 2, -1, 0], [-S / 2, -S / 2, 0, 1], [S / 2, S / 2, 0, -1]]) {
    for (let b = 0; b < 5; b++) {
      const pos = [];
      for (let i = 0; i <= N; i++) {
        const t = (i / N) * S, x = ax + sx * t, z = az + sz * t, ytop = h(x, z);
        const y0 = BASE + (ytop - BASE) * (b / 5) + 0.05 * Math.sin(t * 3 + b), y1 = b === 4 ? ytop : BASE + (ytop - BASE) * ((b + 1) / 5) + 0.05 * Math.sin(t * 3 + b + 1);
        pos.push(x, y0, z, x, y1, z);
      }
      const idx = []; for (let i = 0; i < N; i++) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
      const sg = new THREE.BufferGeometry(); sg.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); sg.setIndex(idx); sg.computeVertexNormals();
      scene.add(new THREE.Mesh(sg, Object.assign(bands[b].clone(), { side: THREE.DoubleSide })));
    }
  }
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(S + 0.3, 0.25, S + 0.3), mat("#efe7da")); plinth.position.y = BASE - 0.125; plinth.receiveShadow = true; scene.add(plinth);
}

// ② 덤불: 다면체를 울퉁불퉁하게 밀어 만든 덩어리, 아래쪽일수록 어둡게(덩어리별 그늘)
function bush(x, z, r) {
  const g = new THREE.IcosahedronGeometry(r, 1), p = g.attributes.position, col = [];
  for (let i = 0; i < p.count; i++) {
    const v = new THREE.Vector3().fromBufferAttribute(p, i), k = 1 + 0.18 * Math.sin(v.x * 9 + v.y * 7) * Math.cos(v.z * 8);
    v.multiplyScalar(k); v.y *= 0.75; p.setXYZ(i, v.x, v.y, v.z);
    const ao = 0.55 + 0.45 * (v.y / r + 0.75) / 1.5; col.push(0.42 * ao, 0.6 * ao, 0.5 * ao);
  }
  g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat("#ffffff", { vertexColors: true })); m.position.set(x, h(x, z) + r * 0.45, z); m.castShadow = m.receiveShadow = true; scene.add(m);
}
for (const [x, z, r] of [[-1.4, 1.2, 0.35], [-1.0, 1.5, 0.25], [1.3, -1.2, 0.4], [1.6, -0.8, 0.25], [-1.5, -1.4, 0.3], [1.4, 1.4, 0.3]]) bush(x, z, r);

// ③ 상자 관절 인물 + 2관절 IK: 어깨·손 목표 위치를 주면 팔꿈치 자리를 계산해 위팔·아래팔을 놓음
const rig = new THREE.Group(); rig.position.set(0.3, h(0.3, 0.6), 0.6); scene.add(rig);
const M = { suit: mat("#a9cbe8", { roughness: 0.4 }), skin: mat("#f0c9ab"), hair: mat("#2a2220"), hat: mat("#efe6cf"), shoe: mat("#1d1b1b"), wood: mat("#c4874a"), box: mat("#7f8f6c") };
const part = (w, hgt, d, m) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, hgt, d), m); o.castShadow = true; rig.add(o); return o; };
// 두 점 사이에 상자를 놓음(팔·다리 마디)
function bone(m, a, b, t) { m.position.copy(a).add(b).multiplyScalar(0.5); m.scale.set(1, a.distanceTo(b), 1); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize()); }
// 2관절 IK: 두 마디 길이 L1, L2, 굽히는 방향 pole
function ik(root, target, L1, L2, pole) {
  const d = target.clone().sub(root), dist = Math.min(d.length(), L1 + L2 - 1e-3), dir = d.normalize();
  const a = Math.acos(THREE.MathUtils.clamp((L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist), -1, 1));
  const side = pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir))).normalize();
  return root.clone().add(dir.clone().multiplyScalar(Math.cos(a) * L1)).add(side.multiplyScalar(Math.sin(a) * L1));
}
part(0.5, 0.3, 0.4, M.box).position.set(0, 0.15, -0.05);                        // 앉은 상자
const torso = part(0.36, 0.5, 0.22, M.suit); torso.position.set(0, 0.6, 0);
const head = part(0.2, 0.22, 0.2, M.skin); head.position.set(0, 1.0, 0);
part(0.24, 0.12, 0.24, M.hair).position.set(0, 1.12, -0.02);
const brim = part(0.4, 0.02, 0.4, M.hat); brim.position.set(0, 1.17, 0);
part(0.24, 0.1, 0.24, M.hat).position.set(0, 1.23, 0);
for (const s of [-1, 1]) {                                                        // 앉은 다리: 허벅지 앞으로, 정강이 아래로
  const hip = new THREE.Vector3(s * 0.1, 0.36, 0), knee = new THREE.Vector3(s * 0.11, 0.36, 0.36), foot = new THREE.Vector3(s * 0.12, 0.02, 0.4);
  bone(part(0.14, 1, 0.14, M.suit), hip, knee); bone(part(0.15, 1, 0.15, M.suit), knee, foot);
  part(0.12, 0.07, 0.22, M.shoe).position.set(s * 0.12, 0.035, 0.46);
}
const guitar = new THREE.Group(); rig.add(guitar); guitar.position.set(-0.04, 0.55, 0.2); guitar.rotation.z = -1.1;
for (const [y, r] of [[-0.08, 0.17], [0.09, 0.13]]) { const b = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.09, 10), M.wood); b.rotation.x = Math.PI / 2; b.position.y = y; b.castShadow = true; guitar.add(b); }
const neck = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.5, 0.03), mat("#5a3a22")); neck.position.y = 0.42; guitar.add(neck);
const arms = [0, 1].map(() => ({ up: part(0.1, 1, 0.1, M.suit), lo: part(0.09, 1, 0.09, M.suit), hand: part(0.08, 0.08, 0.08, M.skin) }));

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  // 오른손: 소리구멍 앞에서 위아래로 줄을 튕김, 왼손: 기타 목을 따라 천천히 오르내림
  const goals = [
    { sh: new THREE.Vector3(-0.22, 0.8, 0), hand: new THREE.Vector3(-0.05, 0.53 + 0.06 * Math.sin(t * 8), 0.3), pole: new THREE.Vector3(-1, -0.3, -0.5) },
    { sh: new THREE.Vector3(0.22, 0.8, 0), hand: new THREE.Vector3(0.36 + 0.04 * Math.sin(t * 1.3), 0.72 + 0.02 * Math.sin(t * 1.3), 0.26), pole: new THREE.Vector3(1, -0.5, -0.3) },
  ];
  goals.forEach((g, i) => { const elbow = ik(g.sh, g.hand, 0.28, 0.26, g.pole); bone(arms[i].up, g.sh, elbow); bone(arms[i].lo, elbow, g.hand); arms[i].hand.position.copy(g.hand); });
  head.rotation.z = 0.05 * Math.sin(t * 2); brim.rotation.z = head.rotation.z;
  controls.update(); renderer.render(scene, camera);
});
</script>
</body>
</html>
