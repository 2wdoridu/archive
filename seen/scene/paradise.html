const CAM = new THREE.Vector3(1, 6.5, 44), LOOK = new THREE.Vector3(0, 6.5, -60);
camera.position.copy(CAM); camera.lookAt(LOOK);

// 같은 결과가 나오도록 정해진 순서의 난수
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// 하늘·안개: 낮, 연한 푸른빛에 보랏빛이 살짝 도는 지평선
const HAZE = new THREE.Color("#c8cfe8");
function gradientTexture(stops) {

// 애니 셀 재질(sakura-crossing 방식): 햇빛을 3단계 평평한 띠로 끊는 램프. 툰 재질에 없는 옵션(거칠기·금속성 등)은 버림

// 값 노이즈: 언덕과 산의 높이
const hash = (x, z) => { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); };

  { z: -38, h: 6, back: 9, front: 7, tilt: 0.25, lean: -0.45, seed: 2 },    // 중경: 왼쪽이 높고 오른쪽으로 물러남

function lineAt(line, sx) {

  { line: SKYLINE, z: -175, front: 70, back: 22 },
  // 산 아래 둔덕 줄: 왼쪽 둔덕이 둥글게 솟고 가운데서 꺼졌다가 오른쪽 산 밑으로 이어짐
  { line: toScreen([[-60, 615], [0, 610], [150, 588], [300, 568], [420, 563], [520, 585], [650, 628], [760, 640], [880, 602], [1000, 612], [1150, 650], [1374, 662], [1440, 668]]), z: -122, front: 34, back: 14 },

  { line: toScreen([[-60, 702], [0, 700], [150, 690], [300, 665], [420, 650], [560, 690], [700, 740], [850, 770], [1000, 790], [1150, 780], [1300, 762], [1440, 760]]), z: -72, front: 30, back: 13 },

  { line: toScreen([[-60, 878], [0, 880], [200, 900], [400, 930], [600, 958], [800, 968], [950, 958], [1100, 930], [1250, 900], [1374, 880], [1440, 872]]), z: -28, front: 24, back: 12 },

function layerHeight(L, x, z) {

  const shape = fall * (1 - 0.32 * Math.pow(fbm(x * 0.09, z * 0.14), 1.5));

  for (const L of LAYERS) h = Math.max(h, layerHeight(L, x, z));
  return h;

// 길: 공연 첫 장면처럼 산등성이 너머에서 넘어와 비탈을 굽이굽이 내려와 앞쪽 언덕으로 다가오는 찻길
const PH_W = 1374, PH_H = 1692;
// 화면 좌표(사진 1374×1692) → 지형 위 점: 카메라에서 광선을 쏘아 길 내기 전 지형과 처음 만나는 곳
function screenToGround(px, py) {
  camera.updateMatrixWorld();
  const rc = new THREE.Raycaster();
  rc.setFromCamera(new THREE.Vector2(px / PH_W * 2 - 1, 1 - py / PH_H * 2), camera);
  const o = rc.ray.origin, d = rc.ray.direction, at = t => o.clone().addScaledVector(d, t);

// 길(사용자가 공연 사진에 그린 화살표 순서, 사진 1374×1692 좌표):
// 큰 산 왼쪽 어깨에서 왼쪽으로 가다 머리핀으로 꺾여 오른쪽 → 큰 산 아래를 가로질러 오른쪽 산 비탈로 내려감 →
// 오른쪽 끝에서 되돌아 한 단 아래 언덕을 왼쪽으로 → 왼쪽 비탈에서 크게 U자 → 큰 바위 왼쪽으로 다가와 바위 뒤를 지나 오른쪽 위로 빠짐

  [1295, 795], [1080, 810], [880, 825], [1000, 857], [780, 882], [520, 885], [300, 887], [262, 947], [320, 1027], [440, 1087], [700, 1112], [900, 1087],

  .map(([x, y]) => new THREE.Vector3(...screenToGround(x, y))));

const SAND = new THREE.Color("#cfa293"), RED = new THREE.Color("#b07e84"), DARK = new THREE.Color("#6e5a70"),

{

function roadRibbon(curve, pts, width, lift, color, hideDepth = true) {
  const N = pts.length - 1, pos = [], idx = [];
  const side = new THREE.Vector3();
  for (let i = 0; i <= N; i++) {
    const u = i / N, p = pts[i], tg = curve.getTangentAt(u);
    side.set(-tg.z, 0, tg.x).normalize();
    // 카메라 쪽으로 곧장 뻗는 구간은 언덕 뒤를 잇는 숨은 길이라 그리지 않음(그리면 세로 기둥처럼 보임)
    const w = width * smooth(0, 0.02, u) * (hideDepth ? 1 - smooth(0.7, 0.85, Math.abs(tg.z)) : 1);
    for (const k of [-1, 1]) pos.push(p.x + side.x * w * 0.5 * k, p.y + lift, p.z + side.z * w * 0.5 * k);
    if (i < N) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat(color, { side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2 }));
  m.receiveShadow = true; scene.add(m);
}

const wind = { value: 0 };

let TUFT, GRASS_MAT;
{

// 풀 포기를 주어진 자리마다 심음
// 가려지는 관계만 따로 정하기: 깊이값을 실제 거리의 1/k 로 계산해 씀(움직임은 실제 자리 기준)

  const m = material.clone();
  m.onBeforeCompile = sh => { sh.vertexShader = sh.vertexShader.replace("#include <project_vertex>", `#include <project_vertex>

function jitter(geo, amt, edge = 0) {

  if (edge) geo = new TessellateModifier(edge, 8).modify(geo.index ? geo.toNonIndexed() : geo);
  geo = BufferUtils.mergeVertices(geo);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setXYZ(i, p.getX(i) + (rnd() - 0.5) * amt, p.getY(i) + (rnd() - 0.5) * amt, p.getZ(i) + (rnd() - 0.5) * amt);
  geo.computeVertexNormals(); return geo;
}

  // 트럭 카메라는 트럭을, 배경 카메라는 바위를 중심으로 같은 각도만큼 돈다 → 바위와 트럭이 한 덩어리로 움직이고 먼 산만 어긋남

    camera.lookAt(TILT_LOOK.clone().sub(TILT_PIV).applyAxisAngle(TILT_RIGHT, -pitch).applyAxisAngle(UP, yaw).add(TILT_PIV)); }

  woman.update(t); man.update(t);
  // 휴대폰: 배경 그림자는 6장에 한 번만 새로 그림(배경에서 그림자를 드리우는 것은 해 방향 말고는 움직이지 않음)
  if (LITE) { tick.n = (tick.n || 0) + 1; sun.shadow.needsUpdate = tick.n % 6 === 1; }
  renderer.setRenderTarget(rtBg); renderer.render(scene, camera);
  renderer.setClearColor(0x000000, 0); renderer.setRenderTarget(rtFg); renderer.clear(); renderer.render(truckScene, truckCam);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);

  requestAnimationFrame(tick);
}
