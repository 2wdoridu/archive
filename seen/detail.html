<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 완성 전까지 검색 결과에 안 나오게 막아 둔다. 공개할 때 아래 robots 태그를 지운다 -->
<meta name="robots" content="noindex">
<title>관람 기록 — 2w_doridu Archive</title>
<link rel="icon" href="../icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../style.css?v=20261102-1">
<style>
  .detail__media img { aspect-ratio: 3 / 4; object-fit: cover; }
  /* 3D 장면 항목: 화면 높이에 맞춘 3:4 틀에 장면을 띄움 */
  .detail__frame:has(.detail__scene) { width: min(100%, calc((100vh - 120px) * 0.75)); }
  /* 장면 카드: 포켓몬 홀로 카드처럼 펄 테두리 위에 무지갯빛 박이 비치고, 기울이면 빛과 그림자가 따라 움직인다
     --tx, --ty: 카드 가운데 기준 손가락·마우스 위치(-1~1), --on: 기울이는 중이면 1 */
  .detail__media:has(.detail__scene) { perspective: 1400px; }
  .detail__frame:has(.detail__scene) {
    --tx: 0; --ty: 0; --on: 0;
    position: relative; padding: 11px; border-radius: 40px; isolation: isolate;
    background:
      linear-gradient(160deg, rgb(255 255 255 / .95), rgb(255 255 255 / 0) 40%),
      linear-gradient(200deg, #f7f3fb 0%, #ece6f2 40%, #e3dbe6 70%, #efe9e3 100%);
    transform: rotateY(calc(var(--tx) * 11deg)) rotateX(calc(var(--ty) * -11deg)) scale(calc(1 + var(--on) * .015));
    box-shadow:
      inset 0 1px 0 rgb(255 255 255), inset 0 -1px 0 rgb(120 100 140 / .18),
      0 1px 1px rgb(60 40 90 / .10),
      calc(var(--tx) * -6px) calc(6px - var(--ty) * 4px) 14px -6px rgb(60 40 90 / .22),
      calc(var(--tx) * -22px) calc(26px - var(--ty) * 14px) 50px -22px rgb(90 60 150 / .38);
    transition: transform .7s cubic-bezier(.2, .8, .2, 1), box-shadow .7s cubic-bezier(.2, .8, .2, 1);
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  .detail__frame.is-tilt { transition-duration: .12s; }
  /* 테두리에만 보이는 홀로 박: 장면이 위를 덮으므로 테두리 띠에서만 드러난다 */
  .detail__frame:has(.detail__scene)::before {
    content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; corner-shape: inherit;
    background:
      repeating-linear-gradient(115deg, #ffb3dc 0%, #b9d8ff 6%, #b8f5dc 12%, #fff0b0 18%, #e2c0ff 24%, #ffb3dc 30%),
      repeating-linear-gradient(25deg, rgb(255 255 255 / .0) 0 3px, rgb(255 255 255 / .35) 3px 4px);
    background-size: 260% 260%, 100% 100%;
    background-position: calc(50% + var(--tx) * 40%) calc(50% + var(--ty) * 40%), 0 0;
    mix-blend-mode: multiply; opacity: calc(.45 + var(--on) * .35);
    transition: opacity .5s, background-position .7s cubic-bezier(.2, .8, .2, 1);
  }
  /* 빛 반사: 손가락·마우스가 있는 쪽이 밝아진다 */
  .detail__frame:has(.detail__scene)::after {
    content: ""; position: absolute; inset: 0; z-index: 2; border-radius: inherit; corner-shape: inherit; pointer-events: none;
    background: radial-gradient(farthest-corner circle at calc(50% + var(--tx) * 50%) calc(50% + var(--ty) * 50%),
      rgb(255 255 255 / .55) 0%, rgb(255 255 255 / .18) 22%, rgb(255 255 255 / 0) 55%);
    mix-blend-mode: soft-light; opacity: calc(.25 + var(--on) * .75); transition: opacity .5s;
  }
  .detail__scene { position: relative; z-index: 1; display: block; width: 100%; aspect-ratio: 3 / 4; border: 0; border-radius: 30px; pointer-events: none;
    box-shadow: 0 0 0 1px rgb(255 255 255 / .85), 0 0 0 3px rgb(150 120 180 / .35), 0 0 0 4px rgb(255 255 255 / .6); }
  /* 애플식 연속 곡률(스쿼클)을 지원하는 브라우저: 같은 크기여도 모서리가 작아 보여 값을 키운다 */
  @supports (corner-shape: squircle) {
    .detail__frame:has(.detail__scene) { border-radius: 64px; corner-shape: squircle; }
    .detail__scene { border-radius: 53px; corner-shape: squircle; }
  }
</style>
</head>
<body>
<header class="bar">
  <a class="bar__name" href="../index.html">2w_doridu</a>
  <nav class="bar__links">
    <a href="../studio.html">작업실</a>
    <a href="../info.html">정보</a>
    <button type="button" class="bar__close detail__close">닫기 ×</button>
  </nav>
</header>

<main class="detail" id="post"></main>
<nav class="pager"></nav>

<script src="data.js?v=20261108-3"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
const i = Math.max(0, SEEN.findIndex(s => s.id === id));
const s = SEEN[i];
const prev = SEEN[i - 1], next = SEEN[i + 1];
document.title = `${s.title} — 2w_doridu Archive`;
document.getElementById("post").innerHTML = `
  <div class="detail__media"><div class="detail__frame">${s.scene ? `<iframe class="detail__scene" src="${s.scene}?embed&v=20261109-1" title="${s.title}"></iframe>` : `<img src="${s.img}" alt="${s.title}">`}</div></div>
  <div class="detail__side info">
    <h1 class="detail__title">${s.title}</h1>
    <p class="info__line">${[s.kind, s.by, s.place].filter(Boolean).join(" · ")}</p>
    <p class="info__line--muted">${s.date}</p>
  </div>`;

// 마우스 위치(틀 가운데 기준 -1~1)를 장면에 보내 보는 각도를 바꾼다. 카드 위에 있으면 카드도 그쪽으로 기운다
const scene = document.querySelector(".detail__scene");
if (scene) {
  const card = scene.parentElement;
  const send = (x, y, k = 1) => scene.contentWindow.postMessage({ type: "tilt", x, y, k }, location.origin);
  const clamp = v => Math.max(-1, Math.min(1, v));
  let box = card.getBoundingClientRect();
  const at = (cx, cy) => [clamp((cx - box.left - box.width / 2) / (box.width / 2)), clamp((cy - box.top - box.height / 2) / (box.height / 2))];
  const lean = (x, y) => { card.classList.add("is-tilt"); card.style.setProperty("--tx", x.toFixed(3)); card.style.setProperty("--ty", y.toFixed(3)); card.style.setProperty("--on", 1); };
  const rest = () => { card.classList.remove("is-tilt"); card.style.setProperty("--tx", 0); card.style.setProperty("--ty", 0); card.style.setProperty("--on", 0); };
  addEventListener("mousemove", e => {
    box = card.getBoundingClientRect();
    const [x, y] = at(e.clientX, e.clientY);
    send(x, y);
    if (card.matches(":hover")) lean(x, y); else rest();
  });
  document.documentElement.addEventListener("mouseleave", () => { send(0, 0); rest(); });
  // 휴대폰: 카드 위를 손가락으로 끌면 카드가 기울고 장면 시점이 크게(2.5배) 돈다. 떼면 가운데로 돌아온다
  const touchAt = t => { const [x, y] = at(t.clientX, t.clientY); send(x, y, 2.5); lean(x, y); };
  card.addEventListener("touchstart", e => { box = card.getBoundingClientRect(); touchAt(e.touches[0]); }, { passive: true });
  card.addEventListener("touchmove", e => { e.preventDefault(); touchAt(e.touches[0]); }, { passive: false });
  const end = () => { send(0, 0, 2.5); rest(); };
  card.addEventListener("touchend", end);
  card.addEventListener("touchcancel", end);
}

// 닫기: 목록에서 넘어왔으면 이전 화면으로, 링크로 바로 들어왔으면 목록으로 간다
document.querySelector(".detail__close").addEventListener("click", () => {
  const fromSite = document.referrer && new URL(document.referrer).origin === location.origin;
  if (fromSite && history.length > 1) history.back();
  else location.href = "index.html";
});
addEventListener("keydown", e => {
  if (e.key === "Escape") document.querySelector(".detail__close").click();
  if (e.key === "ArrowLeft" && prev) location.replace(`detail.html?id=${prev.id}`);
  if (e.key === "ArrowRight" && next) location.replace(`detail.html?id=${next.id}`);
});

document.querySelector(".pager").innerHTML =
  (prev ? `<a class="pill" href="detail.html?id=${prev.id}">← 이전</a>` : "<span></span>") +
  (next ? `<a class="pill" href="detail.html?id=${next.id}">다음 →</a>` : "");
</script>
</body>
</html>
