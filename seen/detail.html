<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 완성 전까지 검색 결과에 안 나오게 막아 둔다. 공개할 때 아래 robots 태그를 지운다 -->
<meta name="robots" content="noindex">
<title>관람 기록 — 2w_doridu Archive</title>
<link rel="icon" href="../icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../style.css?v=20261102-1">
<style>
  .detail__media img { aspect-ratio: 3 / 4; object-fit: cover; }
  /* 3D 장면 항목: 화면 높이에 맞춘 3:4 틀에 장면을 띄움 */
  .detail__frame:has(.detail__scene) { width: min(100%, calc((100vh - 120px) * 0.75)); }
  /* 장면 카드: 둥근 모서리 + 밝은 테두리 + 바닥 그림자 */
  .detail__frame:has(.detail__scene) {
    padding: 8px; border-radius: 40px;
    background: linear-gradient(160deg, #ffffff 0%, #f1efe9 45%, #dcd8cf 100%);
    box-shadow:
      inset 0 1px 0 rgb(255 255 255 / .9), inset 0 0 0 1px rgb(0 0 0 / .06),
      0 1px 2px rgb(40 30 60 / .08), 0 8px 18px -6px rgb(40 30 60 / .18),
      0 28px 60px -18px rgb(40 30 60 / .32);
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  .detail__scene { display: block; width: 100%; aspect-ratio: 3 / 4; border: 0; border-radius: 32px; pointer-events: none;
    box-shadow: 0 0 0 1px rgb(0 0 0 / .1); }
  /* 애플식 연속 곡률(스쿼클)을 지원하는 브라우저: 같은 크기여도 모서리가 작아 보여 값을 키운다 */
  @supports (corner-shape: squircle) {
    .detail__frame:has(.detail__scene) { border-radius: 64px; corner-shape: squircle; }
    .detail__scene { border-radius: 56px; corner-shape: squircle; }
  }
</style>
</head>
<body>
<header class="bar">
  <a class="bar__name" href="../index.html">2w_doridu</a>
  <nav class="bar__links">
    <a href="../studio.html">작업실</a>
    <a href="../info.html">정보</a>
    <button type="button" class="bar__close detail__close">닫기 ×</button>
  </nav>
</header>

<main class="detail" id="post"></main>
<nav class="pager"></nav>

<script src="data.js?v=20261108-3"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
const i = Math.max(0, SEEN.findIndex(s => s.id === id));
const s = SEEN[i];
const prev = SEEN[i - 1], next = SEEN[i + 1];
document.title = `${s.title} — 2w_doridu Archive`;
document.getElementById("post").innerHTML = `
  <div class="detail__media"><div class="detail__frame">${s.scene ? `<iframe class="detail__scene" src="${s.scene}?embed" title="${s.title}"></iframe>` : `<img src="${s.img}" alt="${s.title}">`}</div></div>
  <div class="detail__side info">
    <h1 class="detail__title">${s.title}</h1>
    <p class="info__line">${[s.kind, s.by, s.place].filter(Boolean).join(" · ")}</p>
    <p class="info__line--muted">${s.date}</p>
  </div>`;

// 장면 틀은 그대로 두고, 마우스 위치(틀 가운데 기준 -1~1)를 장면에 보내 보는 각도를 바꾼다
const scene = document.querySelector(".detail__scene");
if (scene) {
  const send = (x, y) => scene.contentWindow.postMessage({ type: "tilt", x, y }, location.origin);
  const clamp = v => Math.max(-1, Math.min(1, v));
  addEventListener("mousemove", e => {
    const r = scene.getBoundingClientRect();
    send(clamp((e.clientX - r.left - r.width / 2) / (r.width / 2)), clamp((e.clientY - r.top - r.height / 2) / (r.height / 2)));
  });
  document.documentElement.addEventListener("mouseleave", () => send(0, 0));
  // 휴대폰: 카드 위를 손가락으로 끌면 같은 방식으로 보는 각도가 바뀌고, 떼면 가운데로 돌아온다
  const card = scene.parentElement;
  const touchAt = t => {
    const r = scene.getBoundingClientRect();
    send(clamp((t.clientX - r.left - r.width / 2) / (r.width / 2)), clamp((t.clientY - r.top - r.height / 2) / (r.height / 2)));
  };
  card.addEventListener("touchstart", e => touchAt(e.touches[0]), { passive: true });
  card.addEventListener("touchmove", e => { e.preventDefault(); touchAt(e.touches[0]); }, { passive: false });
  card.addEventListener("touchend", () => send(0, 0));
  card.addEventListener("touchcancel", () => send(0, 0));
}

// 닫기: 목록에서 넘어왔으면 이전 화면으로, 링크로 바로 들어왔으면 목록으로 간다
document.querySelector(".detail__close").addEventListener("click", () => {
  const fromSite = document.referrer && new URL(document.referrer).origin === location.origin;
  if (fromSite && history.length > 1) history.back();
  else location.href = "index.html";
});
addEventListener("keydown", e => {
  if (e.key === "Escape") document.querySelector(".detail__close").click();
  if (e.key === "ArrowLeft" && prev) location.replace(`detail.html?id=${prev.id}`);
  if (e.key === "ArrowRight" && next) location.replace(`detail.html?id=${next.id}`);
});

document.querySelector(".pager").innerHTML =
  (prev ? `<a class="pill" href="detail.html?id=${prev.id}">← 이전</a>` : "<span></span>") +
  (next ? `<a class="pill" href="detail.html?id=${next.id}">다음 →</a>` : "");
</script>
</body>
</html>
